name: Build artifacts

on:
  workflow_dispatch:
    inputs:
      git-sha:
        description: "Commit SHA-1 to checkout"
        required: false
        default: ""
  workflow_call:
    inputs:
      git-sha:
        type: string
        required: false
        default: ""

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git-sha || inputs.git-sha || github.sha }}
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      - name: Install npm dependencies
        run: npm ci
      - name: Build the Electron app
        run: npm run electron-mac
      - name: Upload darwin-universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-electron-packager-darwin-universal
          include-hidden-files: true
          path: .build/test-electron-packager-darwin-universal/*
          if-no-files-found: error
